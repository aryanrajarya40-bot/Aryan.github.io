<!--
  Category colors (pick one, use consistently in the meta span and the rule below):
  Craft    -> var(--coral)
  Noticing -> var(--cobalt)
  Memory   -> var(--violet)
  Time     -> var(--sunflower)  (use #B8860B for the text color, sunflower is too light to read)
-->

<article>
  <div class="essay-header">
    <span class="spine__meta" style="color: var(--coral);">CATEGORY &middot; N min read</span>
    <h1>ESSAY TITLE</h1>
    <p class="dek">One-sentence dek that sets up the essay.</p>
  </div>
  <div class="essay-rule"></div>
  <div class="essay-body">
    <p>First paragraph...</p>
    <h2>An optional subheading</h2>
    <p>More paragraphs...</p>
    <blockquote>An optional pull quote.</blockquote>
    <p>Closing paragraph...</p>
  </div>
</article>
